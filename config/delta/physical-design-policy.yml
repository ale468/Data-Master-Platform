schema_version: 1
policy_id: data-master-delta-physical-design-v1
current_decision: KEEP_UNPARTITIONED
scope: local_synthetic_demo

boundaries:
  table_partitioning: Physical directory layout chosen when a Delta table is written.
  execution_partitioning: Spark shuffle, DataFrame and Delta snapshot parallelism; it does not change table layout.
  catalog_metadata: Logical naming and discovery; it does not choose or optimize physical layout.
  automatic_maintenance_authorized: false
  destructive_vacuum_authorized: false

decision_states:
  KEEP_UNPARTITIONED:
    next: [OBSERVE]
    evidence: Current workload does not justify physical partitioning.
  OBSERVE:
    next: [KEEP_UNPARTITIONED, EXPERIMENT]
    evidence: File health and representative query families are measured across runs.
  EXPERIMENT:
    next: [KEEP_UNPARTITIONED, OBSERVE, ADOPT]
    evidence: Equivalent repeated workloads compare layout candidates with functional fingerprints.
  ADOPT:
    next: [OBSERVE]
    evidence: A separately reviewed decision records material benefit, compatibility, recovery and rollback.

file_health_contract:
  version: 1
  small_file_threshold_bytes: 16777216
  required_metrics: [active_file_count, active_bytes, min_file_bytes, median_file_bytes, p95_file_bytes, max_file_bytes, small_file_count, small_file_ratio, physical_partition_count, delta_version]
  optional_metrics: [growth_active_bytes, files_scanned, bytes_scanned, scan_amplification_ratio]
  privacy_classification: technical_aggregate_only
  claim_limits:
    - A threshold or row count alone cannot promote a layout.
    - Missing workload or equivalence evidence produces NO_CHANGE or INCONCLUSIVE.
    - Metrics from the local synthetic demo do not establish production scale, SLA or cost savings.

maintenance:
  compaction:
    authorized: false
    trigger: reviewed_experiment_only
    required_evidence: [small_file_pressure, representative_workload, functional_equivalence]
  vacuum:
    authorized: false
    minimum_retention_hours: 168
    requires: [separate_authorization, recovery_check, evidence_preservation_check]
  failure_mode: fail_closed

table_family_defaults:
  bronze:
    current_layout: UNPARTITIONED
    expected_growth: bounded_local_demo
    dominant_access_patterns: [batch_replay, full_table_validation]
    risks: [small_files_from_frequent_batches, over_partitioning]
  raw_vault:
    current_layout: UNPARTITIONED
    expected_growth: bounded_local_demo
    dominant_access_patterns: [business_key_lookup, latest_satellite_state, lineage_join]
    risks: [high_cardinality_hash_keys, skew, small_files]
  gold:
    current_layout: UNPARTITIONED
    expected_growth: bounded_local_demo
    dominant_access_patterns: [full_rebuild, aggregate_read]
    risks: [small_outputs, over_partitioning]

physical_tables:

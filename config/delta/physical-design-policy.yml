  - {id: bronze.contas, layer: bronze, name: contas, write_mode: INSERT_ONLY, partition_columns: [], candidate_layout_keys: [], disposition: KEEP_UNPARTITIONED}
  - {id: bronze.transacoes, layer: bronze, name: transacoes, write_mode: INSERT_ONLY, partition_columns: [], candidate_layout_keys: [data_transacao], disposition: OBSERVE}
  - {id: bronze.cartoes, layer: bronze, name: cartoes, write_mode: INSERT_ONLY, partition_columns: [], candidate_layout_keys: [], disposition: KEEP_UNPARTITIONED}
  - {id: bronze.eventos_digitais, layer: bronze, name: eventos_digitais, write_mode: INSERT_ONLY, partition_columns: [], candidate_layout_keys: [timestamp], disposition: OBSERVE}
  - {id: bronze.agencias, layer: bronze, name: agencias, write_mode: INSERT_ONLY, partition_columns: [], candidate_layout_keys: [], disposition: KEEP_UNPARTITIONED}
  - {id: bronze.produtos, layer: bronze, name: produtos, write_mode: INSERT_ONLY, partition_columns: [], candidate_layout_keys: [], disposition: KEEP_UNPARTITIONED}


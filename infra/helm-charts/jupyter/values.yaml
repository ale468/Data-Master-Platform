nameOverride: jupyter
fullnameOverride: jupyter

replicaCount: 1

image:
  repository: data-master-jupyter
  tag: git-unpublished
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8888
  targetPort: 8888

jupyter:
  secretName: data-master-jupyter-secret
  minioSecretName: data-master-jupyter-minio-secret
  baseUrl: "/"

# Spark local no pod Jupyter: mesma pilha Delta/S3A dos jobs, somente leitura.
sparkSubmitArgs: >-
  --master local[2]
  --driver-memory 1g
  --conf spark.driver.bindAddress=127.0.0.1
  --conf spark.driver.host=127.0.0.1
  --conf spark.ui.enabled=false
  --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
  --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
  --conf spark.hadoop.fs.s3a.endpoint=http://minio.data-platform.svc.cluster.local:9000
  --conf spark.hadoop.fs.s3a.path.style.access=true
  --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
  --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
  --conf spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.EnvironmentVariableCredentialsProvider
  --conf spark.sql.shuffle.partitions=4
  --conf spark.databricks.delta.snapshotPartitions=4
  pyspark-shell
env:
  - name: JUPYTER_ENABLE_LAB
    value: "yes"
  - name: JUPYTER_PORT
    value: "8888"
  - name: JUPYTER_IP
    value: "0.0.0.0"
  - name: MINIO_ENDPOINT
    value: "http://minio.data-platform.svc.cluster.local:9000"
  - name: LAKEHOUSE_ROOT
    value: "s3a://lakehouse"
  - name: JUPYTER_SPARK_MASTER
    value: "local[2]"
  - name: SPARK_JARS_PACKAGES
    value: ""
  - name: SPARK_LOG_LEVEL
    value: "WARN"
  - name: SPARK_USER
    value: "nobody"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:-UseContainerSupport -Duser.home=/tmp"

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "3Gi"
    cpu: "2"

nodeSelector: {}

tolerations: []

affinity: {}

nameOverride: jupyter
fullnameOverride: jupyter

replicaCount: 1

image:
  repository: quay.io/jupyter/pyspark-notebook
  tag: "2024-04-01"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8888
  targetPort: 8888

jupyter:
  secretName: data-master-jupyter-secret
  baseUrl: "/"

# Configurações específicas para Jupyter em Kubernetes
sparkSubmitArgs: >-
  --conf spark.hadoop.fs.s3a.endpoint=http://minio.data-platform.svc.cluster.local:9000
  --conf spark.hadoop.fs.s3a.path.style.access=true
  --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
  --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
  --conf spark.sql.catalogImplementation=hive
  --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore.data-platform.svc.cluster.local:9083
  pyspark-shell
env:
  - name: JUPYTER_ENABLE_LAB
    value: "yes"
  - name: JUPYTER_PORT
    value: "8888"
  - name: JUPYTER_IP
    value: "0.0.0.0"
  - name: JUPYTER_ALLOW_INSECURE_WRITES
    value: "true"

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

nodeSelector: {}

tolerations: []

affinity: {}

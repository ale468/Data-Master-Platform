nameOverride: minio
fullnameOverride: minio

replicaCount: 1

image:
  repository: ghcr.io/l33tlamer/minio-backup
  tag: RELEASE.2025-04-22T22-12-26Z
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9000
  consolePort: 9001

credentialsSecretName: data-master-minio-secret
jupyterCredentialsSecretName: data-master-jupyter-minio-secret

clientImage:
  repository: bitnamilegacy/minio-client
  tag: 2024.1.13-debian-11-r0
  pullPolicy: IfNotPresent

# Persistence
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: ""

# Resources
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 200m

extraEnv: []

# Probes
livenessProbe:
  httpGet:
    path: /minio/health/live
    port: 9000
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /minio/health/ready
    port: 9000
  initialDelaySeconds: 5
  periodSeconds: 10

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Service account
serviceAccount:
  create: true
  name: ""

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

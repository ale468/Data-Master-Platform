apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hive-metastore.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "hive-metastore.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hive-metastore.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hive-metastore.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: hive-metastore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HIVE_METASTORE_DB_TYPE
              value: postgres
            - name: HIVE_METASTORE_URI
              value: thrift://0.0.0.0:9083
            - name: HIVE_METASTORE_HOST
              value: "0.0.0.0"
            - name: HIVE_METASTORE_PORT
              value: "9083"
            - name: HIVE_METASTORE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: POSTGRES_USER
            - name: HIVE_METASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: POSTGRES_PASSWORD
            - name: HIVE_METASTORE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: POSTGRES_DB
            - name: HIVE_METASTORE_DB_HOST
              value: "{{ .Values.postgresHost }}"
            - name: HIVE_METASTORE_DB_PORT
              value: "{{ .Values.postgresPort }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: POSTGRES_DB
          ports:
            - containerPort: {{ .Values.service.port }}
              name: thrift
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf
      volumes:
        - name: hive-config
          configMap:
            name: {{ include "hive-metastore.fullname" . }}

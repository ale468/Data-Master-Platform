apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupyter-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.git.repoUrl | quote }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: infra/helm-charts/jupyter
    helm:
      parameters:
        - name: image.repository
          value: {{ .Values.images.jupyter.repository | quote }}
        - name: image.tag
          value: {{ .Values.images.jupyter.tag | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

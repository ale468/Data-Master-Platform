apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata: {}
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: replaced-by-horizontal-profile-adapter
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/work-dir/jobs/scalability/run_horizontal_scalability_benchmark.py
  arguments: []
  sparkVersion: "3.3.1"
  restartPolicy:
    type: Never
  sparkConf:
    spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
    spark.databricks.delta.schema.autoMerge.enabled: "true"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.aws.credentials.provider: com.amazonaws.auth.EnvironmentVariableCredentialsProvider
    spark.dynamicAllocation.enabled: "false"
    spark.eventLog.enabled: "false"
    spark.kubernetes.executor.deleteOnTermination: "false"
    spark.driver.extraJavaOptions: -XX:-UseContainerSupport
    spark.executor.extraJavaOptions: -XX:-UseContainerSupport
  driver:
    memoryOverhead: 256m
  executor:
    memoryOverhead: 256m
